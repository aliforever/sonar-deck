[package]
name = "sonar-deck"
version = "0.1.2"
edition = "2024"
description = "Native Windows audio control deck: output switching, app mixer and SteelSeries headset control without SteelSeries GG"
license = "MIT"
repository = "https://github.com/aliforever/sonar-deck"
readme = "README.md"
keywords = ["audio", "windows", "steelseries", "mixer", "headset"]
categories = ["multimedia::audio", "gui"]

[dependencies]
anyhow = "1"
auto-launch = "0.6"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
cpal = "0.18"
# DeepFilterNet3 noise suppression; crates.io only has the 2022 release without the inference engine.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
ureq = { version = "3", features = ["json"] }
hidapi = "2.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
